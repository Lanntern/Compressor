name: CLA

# Asks each new contributor to sign CLA.md by commenting on their pull request, and records who signed in
# signatures/cla.json on the cla-signatures branch (not main, so main can be protected: the bot commits there).
# Pull requests are blocked by the "CLA" check until it's signed.
# It never checks out or runs the pull request's code (pull_request_target is safe for that reason only).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # to record signatures
  pull-requests: write   # to comment on the pull request
  statuses: write        # to set the CLA check

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Lanntern/Compressor/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The copyright holder doesn't sign their own agreement; bots don't contribute copyrightable work.
          allowlist: Lanntern,dependabot[bot],github-actions[bot]
