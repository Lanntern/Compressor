name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:   # (tag pushes always run)
      - "README.md"
      - "CLA.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - ".gitignore"
      - ".github/FUNDING.yml"
      - ".github/workflows/updates.yml"
      - ".github/workflows/cla.yml"
  pull_request:
    paths-ignore:   # (the same list)
      - "README.md"
      - "CLA.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - ".gitignore"
      - ".github/FUNDING.yml"
      - ".github/workflows/updates.yml"
      - ".github/workflows/cla.yml"
  workflow_dispatch:

# A newer push to the same pull request makes the older run pointless: stop it. Runs on main and tags finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (exact versions from requirements.txt, checksums enforced)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install ruff==0.16.9 mypy==2.3.1
      - name: Lint and type check (settings in pyproject.toml)
        run: |
          ruff check .
          mypy wick

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install encoders and Qt runtime libraries
        timeout-minutes: 20
        run: |
          # Skip rebuilding the man page index after installing (the slowest part of apt-get on a runner).
          sudo rm -f /var/lib/man-db/auto-update
          # A slow package mirror once held this step for 40 minutes: give up on a stuck attempt and retry. The
          # runner's Azure mirror can stall on every package, so a retry uses Ubuntu's own archive instead.
          apt="sudo timeout 330 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10"
          for attempt in 1 2 3; do
            $apt update && $apt install -y --no-install-recommends ffmpeg gifsicle libegl1 libxkbcommon0 libfontconfig1 \
              && exit 0
            echo "apt-get didn't finish (attempt $attempt); trying again from archive.ubuntu.com"
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 10
          done
          exit 1
      - uses: actions/cache@v6
        with:
          path: tools
          key: tools-linux-${{ hashFiles('scripts/fetch_tools.py') }}
      - name: Download libjxl 0.11 (cjxl, djxl, cjpegli) and Pandoc (skipped when cached)
        run: python scripts/fetch_tools.py --libjxl --pandoc
      - name: Install (exact versions from requirements.txt, checksums enforced)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
          pip install pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --durations=25

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6
        with:
          path: tools
          key: tools-windows-${{ hashFiles('scripts/fetch_tools.py') }}
      - name: Download encoders (ffmpeg, libjxl, gifsicle), checked against their recorded checksums
        run: |
          pip install --require-hashes -r requirements-build.txt
          python scripts/fetch_tools.py
      - name: Install (exact versions from requirements.txt, checksums enforced)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
          pip install pytest
      - name: Start Everything (voidtools), to test asking it for file lists
        id: everything
        continue-on-error: true
        shell: pwsh
        run: |
          choco install everything -y --no-progress
          $exe = Join-Path $env:ProgramFiles "Everything\Everything.exe"
          Start-Process $exe -ArgumentList "-startup"
          # A fresh install indexes every drive first, which on a busy runner has taken over two minutes. Wait for
          # the index here (up to 5 minutes): when it isn't ready, this optional step fails and the test that asks
          # Everything is skipped (WICK_REQUIRE_EVERYTHING=0), instead of failing as if Wick were broken.
          python -c "import sys, time; from wick import everything; ok = any(everything.available() or time.sleep(2) for _ in range(150)); print('Everything index loaded' if ok else 'Everything index not loaded after 5 minutes'); sys.exit(0 if ok else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Everything didn't load its index in time" }
      - name: Make a small ReFS drive, to test block cloning
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "refs.vhdx"
          $script = Join-Path $env:RUNNER_TEMP "refs.txt"
          @(
            "create vdisk file=`"$vhd`" maximum=4096 type=expandable", "select vdisk file=`"$vhd`"", "attach vdisk",
            "convert gpt", "create partition primary", "format fs=refs quick label=ReFSTest", "assign letter=R"
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if (-not (Test-Path R:\)) { throw "No ReFS drive" }
          "WICK_REFS_DIR=R:\" >> $env:GITHUB_ENV
      - name: Test (uses the real Recycle Bin)
        env:
          WICK_SHOTS_DIR: ${{ runner.temp }}/window-shots
          WICK_REQUIRE_EVERYTHING: ${{ steps.everything.outcome == 'success' && '1' || '0' }}
        run: python -m pytest --durations=25
      - name: Keep window screenshots (title bar check)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-screenshots
          path: ${{ runner.temp }}/window-shots
          if-no-files-found: ignore
          retention-days: 7

  # The app bundle and installer: for main, version tags and manual runs. Pull requests only run the tests
  # (start this workflow by hand on a branch to build it there).
  package:
    if: github.event_name != 'pull_request'
    needs: [lint, linux, windows]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write      # attach the .zip and installer to releases on version tags
      id-token: write      # build provenance (attestations) for those files
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6
        with:
          path: tools
          key: tools-windows-${{ hashFiles('scripts/fetch_tools.py') }}
      - name: Download encoders (ffmpeg, libjxl, gifsicle), checked against their recorded checksums
        run: |
          pip install --require-hashes -r requirements-build.txt
          python scripts/fetch_tools.py
      - name: Install (exact versions from requirements.txt, checksums enforced)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
          pip install pyinstaller
      - name: Draw the app icon (.ico) and write the version details (file Properties, Task Manager)
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python packaging/make_icon.py build/Wick.ico
          python packaging/make_version_file.py build/version.txt
      - name: Build Wick.exe
        run: >
          pyinstaller --noconfirm --windowed --name Wick --icon build/Wick.ico --version-file build/version.txt
          --collect-submodules wick
          --collect-all pillow_heif --collect-all imagequant
          --collect-all mozjpeg_lossless_optimization --collect-all oxipng --collect-all py7zr
          --collect-all pikepdf --collect-all rawpy --collect-submodules fontTools
          packaging/launch.py
      - name: Trim parts of Qt the app doesn't use
        shell: pwsh
        run: |
          # Software OpenGL fallback and Qt Quick/QML: a Widgets app never loads them. (Qt PDF stays: Convert
          # draws PDF pages with it.)
          # The smoke test below opens the real window, so a needed file removed here fails the build.
          $root = "dist/Wick/_internal/PySide6"
          $gone = Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Name -match '^(opengl32sw\.dll|Qt6Quick.*\.dll|Qt6Qml.*\.dll|Qt6VirtualKeyboard.*\.dll)$' }
          "{0} files, {1:N0} MB removed" -f $gone.Count, (($gone | Measure-Object Length -Sum).Sum / 1MB)
          $gone | Remove-Item
      - name: Build the Windows 11 menu (shell extension DLL and its sparse package)
        shell: pwsh
        run: |
          # The DLL (static runtime: nothing extra to install) with the Visual Studio on the runner.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          New-Item -ItemType Directory -Force dist/Wick/shell | Out-Null
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /O2 /MT /EHsc /std:c++17 /W4 /LD packaging\shell\WickShell.cpp /Fo:build\ /link /DEF:packaging\shell\WickShell.def shlwapi.lib ole32.lib uuid.lib advapi32.lib /OUT:dist\Wick\shell\WickShell.dll"
          if ($LASTEXITCODE -ne 0) { throw "Building WickShell.dll failed" }
          Remove-Item dist/Wick/shell/*.exp, dist/Wick/shell/*.lib -ErrorAction SilentlyContinue
          # The package that gives it an identity (unsigned; the app registers it per user).
          python packaging/make_shell_package.py build/shell-package
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d build\shell-package /p dist\Wick\shell\WickShell.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Get-ChildItem dist/Wick/shell | Select-Object Name, Length
      - name: Report bundle size (what a cold start has to load)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File dist/Wick
          "{0} files, {1:N0} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 30 `
            @{n='MB';e={[math]::Round($_.Length/1MB,1)}}, @{n='File';e={$_.FullName.Substring((Resolve-Path dist/Wick).Path.Length)}} `
            | Format-Table -AutoSize | Out-String -Width 220
      - name: Smoke-test the built app
        shell: pwsh
        run: |
          Copy-Item -Recurse tools dist/Wick/tools
          python packaging/smoke_test.py dist/Wick
      - name: Add docs and licenses, and zip
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md dist/Wick/
          foreach ($f in "LICENSE-ffmpeg.txt", "LICENSE-libjxl.txt", "LICENSE-gifsicle.txt") {
            if (-not (Test-Path "dist/Wick/tools/$f")) { throw "tools/$f is missing from the build" }
          }
          Compress-Archive -Path dist/Wick -DestinationPath Wick-windows.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $version = python -c "import wick; print(wick.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" `
            "/DSourceDir=..\dist\Wick" "/DIconFile=..\build\Wick.ico" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\Wick-setup.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - name: "Claude Desktop extension (MCP): build, and test it against the installed app"
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          New-Item -ItemType Directory -Force build\mcp | Out-Null
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /O2 /MT /W4 /WX packaging\mcp\wick-mcp.c /Fo:build\mcp\ /link advapi32.lib /OUT:build\mcp\wick-mcp.exe"
          if ($LASTEXITCODE -ne 0) { throw "Building wick-mcp.exe failed" }
          # The installed app, found through its App Paths entry (as the extension does on people's PCs): proves the
          # windowed app serves MCP over the pipes it's handed.
          $dir = Join-Path $env:RUNNER_TEMP "WickMcp"
          Start-Process dist\Wick-setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir"
          python packaging\mcp\check_extension.py "$env:RUNNER_TEMP\mcp-check\installed" -- build\mcp\wick-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw "The extension didn't work with the installed app" }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Wick.exe"); $i++) { Start-Sleep 1 }
          # The portable zip: "Wick.exe location" set in the extension's settings.
          $env:WICK_EXE = (Resolve-Path dist\Wick\Wick.exe).Path
          python packaging\mcp\check_extension.py "$env:RUNNER_TEMP\mcp-check\portable" -- build\mcp\wick-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw "The extension didn't work with the portable app" }
          Remove-Item Env:WICK_EXE
          python packaging\make_mcpb.py build\mcp\wick-mcp.exe dist\Wick.mcpb
          # (The manifest's own test runs with the other tests; here: the bundle holds what it should.)
          python -c "import json, zipfile; z = zipfile.ZipFile('dist/Wick.mcpb'); m = json.loads(z.read('manifest.json')); assert set(z.namelist()) >= {'manifest.json', 'server/wick-mcp.exe', 'icon.png'}, z.namelist(); assert len(m['tools']) == 5 and m['server']['entry_point'] == 'server/wick-mcp.exe', m; print('Wick.mcpb', m['version'], len(m['tools']), 'tools')"
          if ($LASTEXITCODE -ne 0) { throw "Wick.mcpb is incomplete" }
      - name: Install, check, and uninstall (silently, for this user)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "WickInstalled"
          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Wick.lnk"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          function Uninstall {
            Start-Process "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Wick.exe"); $i++) { Start-Sleep 1 }  # (it finishes in a copy)
            if (Test-Path "$dir\Wick.exe") { throw "Uninstall left Wick.exe behind" }
          }
          # 1. Every option ticked: each one takes effect, and uninstalling takes each one away again.
          Start-Process dist\Wick-setup.exe -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir", `
            "/TASKS=startmenu,contextmenu,autostart", "/UPDATES=monthly"
          if (-not (Test-Path "$dir\Wick.exe")) { throw "Wick.exe wasn't installed" }
          if (-not (Test-Path $menu)) { throw "No Start menu entry" }
          $uninst = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "Wick"
          if (-not $uninst) { throw "Not listed in Apps & features" }
          python -c "from wick.gui import integration; assert integration.context_menu_installed(), 'no context menu'"
          # Win+R "wick", the Modify item in Installed apps, Default apps / Open with.
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\Wick.exe")) { throw "No App Paths entry" }
          if ($uninst.NoModify -ne 0 -or -not $uninst.ModifyPath) { throw "No Modify entry in Installed apps" }
          if ((Get-ItemProperty "HKCU:\Software\RegisteredApplications" -Name Wick -ErrorAction SilentlyContinue).Wick -ne "Software\Lanntern\Wick\Capabilities") { throw "Not in Default apps" }
          if (-not (Get-ItemProperty "HKCU:\Software\Classes\.jpg\OpenWithProgids" -Name Wick.Picture -ErrorAction SilentlyContinue)) { throw "Not in Open with for .jpg" }
          for ($i = 0; $i -lt 30 -and -not (Get-AppxPackage -Name Lanntern.Wick.ContextMenu); $i++) { Start-Sleep 1 }
          "Windows 11 menu package registered: " + [bool](Get-AppxPackage -Name Lanntern.Wick.ContextMenu)
          if (-not (Get-ItemProperty $run -Name Wick -ErrorAction SilentlyContinue)) { throw "Not started at sign-in" }
          python -c "from PySide6.QtCore import QSettings; assert QSettings('Wick', 'Wick').value('updates/frequency') == 'monthly', 'update check frequency not saved'"
          Uninstall
          if (Test-Path $menu) { throw "Uninstall left the Start menu entry" }
          python -c "from wick.gui import integration; assert not integration.context_menu_installed(), 'context menu left behind'"
          if (Get-ItemProperty $run -Name Wick -ErrorAction SilentlyContinue) { throw "Start at sign-in left behind" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\Wick.exe") { throw "App Paths entry left behind" }
          if (Get-ItemProperty "HKCU:\Software\RegisteredApplications" -Name Wick -ErrorAction SilentlyContinue) { throw "Default apps entry left behind" }
          # (Windows 11's main menu: the package is registered in the background; reported, not required, since the
          # runner is Windows Server, whose Explorer may not take unsigned sparse packages.)
          "Windows 11 menu package after uninstall: " + [bool](Get-AppxPackage -Name Lanntern.Wick.ContextMenu)
          # 2. The defaults: a Start menu shortcut, and nothing else optional.
          Start-Process dist\Wick-setup.exe -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir"
          if (-not (Test-Path "$dir\Wick.exe")) { throw "Wick.exe wasn't installed (defaults)" }
          if (-not (Test-Path $menu)) { throw "No Start menu entry by default" }
          python -c "from wick.gui import integration; assert not integration.context_menu_installed(), 'context menu without asking'"
          if (Get-ItemProperty $run -Name Wick -ErrorAction SilentlyContinue) { throw "Starts at sign-in without asking" }
          Uninstall
          if (Test-Path $menu) { throw "Uninstall left the default Start menu entry" }
          # 3. For everyone (the recommended mode; the runner is an administrator): into a protected folder.
          $all = Join-Path $env:ProgramFiles "WickCI"
          Start-Process dist\Wick-setup.exe -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=`"$all`""   # (quoted: it has a space)
          if (-not (Test-Path "$all\Wick.exe")) { throw "Wick.exe wasn't installed for everyone" }
          $machine = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object DisplayName -eq "Wick"
          if (-not $machine) { throw "Not listed in Apps & features (for everyone)" }
          Start-Process "$all\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          for ($i = 0; $i -lt 60 -and (Test-Path "$all\Wick.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$all\Wick.exe") { throw "Uninstall (for everyone) left Wick.exe behind" }
          # Other users' leftovers: Active Setup runs the clean-up once per user at their next sign-in. Simulate one
          # user's leftovers here and run the registered command as Windows would.
          $setup = Get-ItemProperty "HKLM:\Software\Microsoft\Active Setup\Installed Components\{221A5C66-2C65-4E55-B016-44533EACAE8C}"
          if (-not $setup.StubPath) { throw "No clean-up registered for other users" }
          New-Item -Force "HKCU:\Software\Classes\Wick.Picture\shell\open\command" | Out-Null
          New-Item -Force "HKCU:\Software\Classes\.jpg\OpenWithProgids" | Out-Null
          New-ItemProperty -Force "HKCU:\Software\Classes\.jpg\OpenWithProgids" -Name Wick.Picture -Value "" | Out-Null
          New-ItemProperty -Force $run -Name Wick -Value "x" | Out-Null
          $exe, $rest = $setup.StubPath -split ' ', 2              # (Windows starts it the same way: program + arguments)
          Start-Process -Wait -WindowStyle Hidden -FilePath $exe -ArgumentList $rest
          if (Test-Path "HKCU:\Software\Classes\Wick.Picture") { throw "Clean-up left the ProgID" }
          if (Get-ItemProperty "HKCU:\Software\Classes\.jpg\OpenWithProgids" -Name Wick.Picture -ErrorAction SilentlyContinue) { throw "Clean-up left Open with" }
          if (Get-ItemProperty $run -Name Wick -ErrorAction SilentlyContinue) { throw "Clean-up left start at sign-in" }
          "Other users' clean-up: version $($setup.Version), works."
          "Installed, checked and uninstalled cleanly (all options, the defaults, and for everyone)."
      - uses: actions/upload-artifact@v7
        with:
          name: Wick-windows
          path: dist/Wick
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Wick-setup
          path: dist/Wick-setup.exe
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: Wick-mcpb
          path: dist/Wick.mcpb
          retention-days: 30
      - name: Checksums for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Copy-Item dist/Wick-setup.exe, dist/Wick.mcpb .
          Get-FileHash Wick-setup.exe, Wick-windows.zip, Wick.mcpb -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Record where the release files came from (build provenance)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Wick-setup.exe
            Wick-windows.zip
            Wick.mcpb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        # (Pinned to a commit: a third-party action with write access. Dependabot proposes updates.)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          # A draft: checked, given its notes and published by hand (nobody sees it until then).
          draft: true
          files: |
            Wick-windows.zip
            Wick-setup.exe
            Wick.mcpb
            SHA256SUMS.txt
