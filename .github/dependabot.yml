# Pull requests when a Python library or a CI action has a new version (security fixes included).
# requirements.txt holds exact versions with checksums; Dependabot updates both.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Exact pins (requirements.txt) are always updated. pyproject.toml's ranges (">=8") only change when the new
    # version falls outside them: raising those minimums would only stop people building with older tools.
    versioning-strategy: increase-if-necessary
    groups:
      python-libraries:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
